version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    versioning-strategy: increase
    groups:
      typescript-toolchain:
        patterns:
          - typescript
          - "@types/*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - typescript
          - "@types/*"

  # GitHub Actions: keep SHA pins in workflow files updated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
