name: update-icons

# Weekly cron + manual workflow_dispatch. Watches the two icon upstreams
# for new releases, opens a refresh PR if anything changed. Gated by two
# upstream-health monitors (Microsoft ToU re-fetch + Azure-PlantUML
# archived/disabled flag). If either monitor fires red, the cron
# short-circuits and opens a watchdog issue instead of pulling possibly-
# newly-restricted icons.

on:
  schedule:
    # Monday 06:00 UTC. Adjust if it interferes with weekend release windows.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install build prerequisites (rsvg-convert)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Microsoft Azure Icons ToU monitor
        id: tou_monitor
        continue-on-error: true
        run: bash scripts/monitor_ms_tou.sh

      - name: Azure-PlantUML upstream-health monitor
        id: health_monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/monitor_azure_plantuml_health.sh

      - name: Watchdog issue on monitor failure
        if: steps.tou_monitor.outcome == 'failure' || steps.health_monitor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "watchdog: upstream monitor failed ($(date -u +%Y-%m-%d))" \
            --body "$(printf 'monitor_ms_tou.sh outcome: %s\nmonitor_azure_plantuml_health.sh outcome: %s\n\nManual triage required before the next icon refresh.' "${{ steps.tou_monitor.outcome }}" "${{ steps.health_monitor.outcome }}")"
          exit 1

      - name: Run build scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/build_azure.sh
          bash scripts/build_fabric.sh

      - name: Open PR if dist/ changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            BR="chore/update-icons-$(date -u +%Y%m%d)"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b "${BR}"
            git add dist/
            git commit -m "chore(icons): refresh from upstream $(date -u +%Y-%m-%d)"
            git push origin "${BR}"
            gh pr create \
              --title "chore(icons): weekly upstream refresh" \
              --body "Automated by update-icons.yml. Verify the diff + merge if upstream changes look benign. Tag a new icons-vX.Y.Z release after merge to fire release-icons.yml."
          else
            echo "no upstream changes — nothing to commit"
          fi
