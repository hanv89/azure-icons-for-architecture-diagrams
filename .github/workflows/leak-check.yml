name: leak-check

# Scans tracked text files for tokens that should never appear in the public
# repository: internal phase identifiers, decision-log IDs, internal review
# tags, and organization-internal terms. Runs on every PR + push to main.
#
# The regex is intentionally broad — false positives are easier to whitelist
# than leaks are to recall after they ship. A self-test runs first to ensure
# the regex still catches each pattern category (tests/leak-fixtures.txt).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # `\bR[0-9]{2,3}\b` keeps the existing 2-3-digit window: catches R10+
  # review-finding IDs in tracked-file content without false-positiving
  # legitimate region labels (`R1`/`R2` in deployment diagrams).
  # Single-digit IDs (`R2`, `R6`) leaked via commit messages / branch
  # names in the past; those surfaces are covered by the workspace-side
  # `scripts/check-leaks.sh` pre-push hook, which scans commit messages
  # too.
  PATTERN: 'Phase[ -]?[0-9]+\.|D-[0-9]{3}|\bR[0-9]{2,3}\b|sun group|sungroup|phú quốc|head of tech'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Self-test — regex must match every known-bad pattern fixture
        run: |
          set -uo pipefail
          # Each non-comment line in the fixture is a string the regex MUST flag.
          # If any non-comment line stops matching, fail loud so the regex
          # cannot silently drop a pattern.
          MISSED=$(grep -vE '^\s*(#|$)' tests/leak-fixtures.txt | grep -vE "$PATTERN" || true)
          if [ -n "$MISSED" ]; then
            echo "FAIL — leak regex no longer catches these fixture lines:"
            echo "$MISSED"
            exit 1
          fi
          echo "PASS — leak regex catches every fixture line."

      - name: Grep for internal-only tokens
        run: |
          set -uo pipefail
          # Patterns flagged:
          #   Phase 1.2 / Phase-1.7 — internal phase identifiers
          #   D-021 / D-013b — decision-log entries
          #   R30            — review-finding shorthand
          #   sun group / phú quốc / head of tech — organization-internal terms

          # -I excludes binary files (PNG icon filenames like
          # "AzureMachineLearningStudioWebServicePlan(m).png" otherwise trigger
          # the \bR[0-9]+\b alternative via binary fingerprint matches).
          # check-leaks.sh is the workspace-side leak scanner — it necessarily
          # embeds the same patterns as regex literals, same as this workflow
          # and the fixture file. Exclude all three from the scan.
          MATCHES=$(git grep -InE "$PATTERN" \
                    -- ':!.github/workflows/leak-check.yml' \
                    ':!tests/leak-fixtures.txt' \
                    ':!scripts/check-leaks.sh' \
                    || true)

          if [ -n "$MATCHES" ]; then
            echo "FAIL — internal tokens found in tracked files:"
            echo "$MATCHES"
            echo ""
            echo "If a match is a legitimate public reference (e.g. an upstream"
            echo "library version, a CVE number), narrow the regex or add a"
            echo "':!path' exclusion to the git-grep invocation above."
            exit 1
          fi

          echo "PASS — no internal tokens detected."
