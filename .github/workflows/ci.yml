name: ci

# Runs npm test on every PR + push to main so a broken state never lands.
# Pairs with release-skill.yml which runs npm test again before npm publish
# so a tagged broken state never publishes either.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: scripts/_lib_icon_build.test.sh
        run: bash scripts/_lib_icon_build.test.sh

      - name: scripts/test_monitor_ms_tou.sh (fixture-based)
        run: bash scripts/test_monitor_ms_tou.sh

      - name: scripts/build_icon_index.test.sh
        run: bash scripts/build_icon_index.test.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download actionlint v1.7.12 binary (pinned release URL)
        run: |
          set -euo pipefail
          # Fetch via HTTPS from the pinned GitHub release; rhysd publishes
          # SHA256 checksums alongside the release artifacts. We fetch the
          # checksums file from the same release and verify the binary
          # archive against it, so the tag-pin alone is not the security
          # boundary.
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o /tmp/actionlint-checksums.txt \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          ( cd /tmp && grep 'linux_amd64\.tar\.gz$' actionlint-checksums.txt | sha256sum -c - )
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          chmod +x /tmp/actionlint
          /tmp/actionlint -version

      - name: actionlint — lint all GitHub Actions workflow YAML
        run: /tmp/actionlint -color

  fixture-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # full history so fixture/skill-md-only fetch can compare against main

      - name: Fetch fixture/skill-md-only
        run: |
          git fetch origin fixture/skill-md-only:fixture/skill-md-only || {
            echo "fixture/skill-md-only does not exist on origin — skipping drift check (will be re-created next time SKILL.md ships)"
            exit 0
          }

      - name: scripts/test_fixture_drift.sh
        run: bash scripts/test_fixture_drift.sh
