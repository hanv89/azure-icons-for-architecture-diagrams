name: ci

# Runs npm test on every PR + push to main so a broken state never lands.
# Pairs with release-skill.yml which runs npm test again before npm publish
# so a tagged broken state never publishes either.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: scripts/_lib_icon_build.test.sh
        run: bash scripts/_lib_icon_build.test.sh

      - name: scripts/test_monitor_ms_tou.sh (fixture-based)
        run: bash scripts/test_monitor_ms_tou.sh

      - name: scripts/build_icon_index.test.sh
        run: bash scripts/build_icon_index.test.sh
