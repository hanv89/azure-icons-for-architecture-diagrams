name: release-skill

# Triggered by 'skill-v*' tag pushes. Detects rc tags (skill-v*-rc.*) and
# publishes them under the npm 'next' dist-tag; non-rc tags publish under
# 'latest'. Each publish uses 'npm publish --provenance' so the resulting
# tarball ships a Sigstore-signed attestation tracing back to this commit
# + this workflow run.
#
# Authority to publish comes from the npm Trusted Publisher entry that
# links @hanv89/azure-arch-skill to this exact workflow file path. No
# long-lived NPM_TOKEN secret is stored on the repo; the 'id-token: write'
# permission lets GitHub mint a short-lived OIDC token that npm verifies
# against its Trusted Publisher record.

on:
  push:
    tags:
      - 'skill-v*'

permissions:
  contents: write   # gh release create
  id-token: write   # OIDC for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
        # NOTE: do NOT set 'registry-url' here. setup-node injects a .npmrc
        # with '_authToken=${NODE_AUTH_TOKEN}' which conflicts with npm's
        # Trusted Publisher OIDC flow — the empty NODE_AUTH_TOKEN becomes
        # the active auth source and npm rejects the publish with a 404
        # PUT (auth error masquerading as not-found). With registry-url
        # omitted, npm uses default registry config and the OIDC token
        # flow takes over.

      - name: Upgrade npm to latest (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install + build + pack
        run: |
          npm ci
          npm run build
          npm pack

      - name: Run tests before publish
        run: npm test

      - name: npm audit gate (block publish on high-severity advisories)
        run: |
          # Block a release if a runtime dep has an unpatched high/critical CVE.
          # --omit=dev so a vulnerable test-only dep doesn't block the publish.
          npm audit --omit=dev --audit-level=high

      - name: Detect npm dist-tag from git tag
        id: dist
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish --provenance
        run: |
          npm publish --provenance --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Build chat-UI distribution bundle
        # Mirrors the npm tarball as a downloadable artifact for chat-UI
        # channels (Claude.ai Project + ChatGPT Custom GPT). The bundle
        # ZIP is byte-reproducible (verified by the bundle-repro CI job).
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/build_chat_ui_bundle.sh
          test -s dist/chat-ui-bundle.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL=$(ls hanv89-azure-arch-skill-*.tgz | head -1)
          VERSION="${GITHUB_REF_NAME#skill-v}"
          BUNDLE="${{ github.workspace }}/dist/chat-ui-bundle.zip"
          NOTES="Release v${VERSION} of @hanv89/azure-arch-skill. Published with Sigstore provenance attestation via Trusted Publisher OIDC. The chat-ui-bundle.zip asset packages SKILL.md + per-vendor INDEX catalogs + worked examples + per-vendor USAGE-RULES + NOTICE for upload into a chat-UI agent's knowledge base (Claude.ai Project or ChatGPT Custom GPT). Setup recipes live under docs/chat-ui-distribution/ on this repo."
          gh release create "${GITHUB_REF_NAME}" "$TARBALL" "$BUNDLE" \
            --title "Azure arch skill v${VERSION}" \
            --notes "$NOTES"
