name: release-icons

# Triggered by 'icons-v*' tag pushes. Creates a GitHub Release with zipped
# dist/Azure/** and dist/Fabric/** as assets. No npm publish — icons are
# a content release, not a package. Removes the manual-tag SPOF that
# --version=X.Y.Z previously depended on.

on:
  push:
    tags:
      - 'icons-v*'

permissions:
  contents: write   # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build asset zips
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#icons-v}"
          # One zip per dist/<Vendor>/ directory. Auto-discover so future
          # vendor adds (per-roadmap micro-phases) don't need a workflow
          # edit — just push the new dist/<Vendor>/ directory and re-tag.
          # Excludes: non-vendor companion dirs.
          #   - dist/skill/      — skill bundle (separate release track via
          #                        release-skill.yml + npm publish)
          #   - dist/Custom/     — reserved placeholder for internal/3rd-party
          #                        icons (empty in Phase 1; ship only when
          #                        non-empty in a future phase by removing
          #                        from this list)
          #   - dist/baselines/  — ToU/policy baseline text files for the
          #                        upstream monitor scripts; not icons
          #   - dist/notes/      — internal notes (if any); not for release
          EXCLUDE_NAMES="skill Custom baselines notes"
          for VENDOR_DIR in dist/*/; do
            [ -d "${VENDOR_DIR}" ] || continue
            VENDOR_BASENAME="$(basename "${VENDOR_DIR}")"
            skip=0
            for excl in ${EXCLUDE_NAMES}; do
              [ "${VENDOR_BASENAME}" = "${excl}" ] && skip=1 && break
            done
            [ "${skip}" = "1" ] && { echo "Skipping non-vendor: ${VENDOR_DIR}"; continue; }
            VENDOR_NAME="$(echo "${VENDOR_BASENAME}" | tr '[:upper:]' '[:lower:]')"
            zip -r "dist-${VENDOR_NAME}-icons-v${VERSION}.zip" "${VENDOR_DIR}"
          done
          ls -la dist-*.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#icons-v}"
          # Build the notes with printf so every line stays inside this YAML
          # block scalar — a column-0 continuation line silently breaks the
          # whole workflow file's parsing.
          notes=$(printf '%s\n' \
            "Icon set release v${VERSION}. One asset zip per dist/<Vendor>/ directory:" \
            "- \`dist-azure-icons-v${VERSION}.zip\` — preserves \`dist/Azure/<Category>/<icon>.png\` layout. Unzip at the consumer's repo root to mirror the upstream structure." \
            "- \`dist-fabric-icons-v${VERSION}.zip\` — preserves \`dist/Fabric/png/<flat>_<size>_<suffix>.png\` layout. Unzip at the consumer's repo root." \
            "- \`dist-kubernetes-icons-v${VERSION}.zip\` — preserves \`dist/Kubernetes/png/<family>/<variant>/<concept>-<size>.png\` layout. Unzip at the consumer's repo root." \
            "" \
            "Additional vendor zips may appear in future releases; each one mirrors the layout of its source \`dist/<Vendor>/\` directory." \
            "" \
            "Built automatically by release-icons.yml.")
          # Glob discovery — picks up every dist-*-icons-v${VERSION}.zip the Build step produced.
          gh release create "${GITHUB_REF_NAME}" \
            dist-*-icons-v${VERSION}.zip \
            --title "Icons v${VERSION}" \
            --notes "${notes}"
